<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Витрина Ачивок</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f1e 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
    }

    /* Кнопка назад */
    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 12px 24px;
      border: 2px solid rgba(78, 205, 196, 0.5);
      border-radius: 12px;
      background: rgba(78, 205, 196, 0.1);
      color: #4ecdc4;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-button:hover {
      background: rgba(78, 205, 196, 0.3);
      transform: translateX(-5px);
      box-shadow: 0 5px 20px rgba(78, 205, 196, 0.5);
    }

    .back-button::before {
      content: '←';
      font-size: 20px;
    }

    /* Экран выбора имени */
    .name-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: background 0.4s ease;
      overflow: hidden;
    }

    .name-box { position: relative; z-index: 2; }

    /* Акцентный цвет окна выбора профиля — меняется при наведении на кнопку */
    .name-screen { --accent: #4ecdc4; }
    .name-screen[data-hover="Вадим"] { --accent: #ff6b6b; }
    .name-screen[data-hover="Эрика"] { --accent: #ffe66d; }
    .name-screen[data-hover="Катя"]  { --accent: #a8e6cf; }
    .name-screen[data-hover="Леша"]  { --accent: #c56cf0; }

    /* Фон всего окна мягко подсвечивается цветом наведённого профиля */
    .name-screen[data-hover] {
      background: radial-gradient(ellipse at center,
        color-mix(in srgb, var(--accent) 12%, transparent) 0%,
        rgba(0, 0, 0, 0.95) 70%);
    }

    .name-box {
      background: color-mix(in srgb, var(--accent) 6%, rgba(255, 255, 255, 0.03));
      border: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      width: min(640px, 92vw);
      transition: border-color 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
    }

    .name-screen[data-hover] .name-box {
      box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .name-box h2 {
      margin-bottom: 30px;
      color: var(--accent);
      font-size: 32px;
      transition: color 0.4s ease;
    }

    .name-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .name-btn {
      width: 100%;
      aspect-ratio: 2 / 1;   /* все кнопки одного размера */
      border: 2px solid color-mix(in srgb, var(--accent) 50%, transparent);
      border-radius: 15px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .name-btn-media {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name-btn-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid color-mix(in srgb, var(--accent) 70%, transparent);
      background: rgba(255,255,255,0.06);
      transition: all 0.3s ease;
    }

    /* Копилка — общий счётчик баллов на экране выбора профиля */
    .piggy-bank {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
      background: linear-gradient(145deg,
        color-mix(in srgb, var(--accent) 25%, #1b1b2a),
        color-mix(in srgb, var(--accent) 8%, #101018));
      box-shadow: inset 0 1px 4px rgba(255,255,255,0.15),
                  0 2px 10px rgba(0,0,0,0.4);
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .piggy-bank .piggy-crystal {
      width: 22px;
      height: 22px;
      object-fit: contain;
      filter: drop-shadow(0 0 5px color-mix(in srgb, var(--accent) 70%, transparent));
    }

    .piggy-bank .coins {
      color: color-mix(in srgb, var(--accent) 40%, #ffe28a);
    }

    .name-btn:hover .piggy-bank {
      border-color: var(--accent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 55%, transparent);
      transform: scale(1.08);
    }

    .name-btn:hover {
      background: color-mix(in srgb, var(--accent) 30%, transparent);
      border-color: var(--accent);
      transform: scale(1.05);
      box-shadow: 0 5px 25px color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .name-btn:hover .name-btn-avatar {
      border-color: var(--accent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 70%, transparent);
      transform: scale(1.08);
    }

    /* Экран пароля */
    .password-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
    }

    .password-box {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(78, 205, 196, 0.3);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
    }

    .password-box h2 {
      margin-bottom: 20px;
      color: #4ecdc4;
    }

    .password-box input {
      width: 100%;
      padding: 15px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .password-box button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4ecdc4, #44a08d);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Профиль */
    .profile {
      text-align: center;
      margin-bottom: 40px;
      margin-top: 60px;
    }

    .avatar {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;            /* круглый аватар */
      border: 5px solid #4ecdc4;     /* простая аккуратная рамка */
      margin: 0 auto 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);   /* Фон на случай прозрачной картинки */
      box-shadow: 0 0 20px rgba(78, 205, 196, 0.45);
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
    }

    /* Питомец справа от аватара */
    .profile-row {
      position: relative;
      width: 220px;
      margin: 0 auto 20px;
    }
    .profile-row .avatar {
      margin: 0;
    }
    .pet-display {
      position: absolute;
      top: 50%;
      right: -84px;
      transform: translateY(-50%);
      font-size: 64px;              /* чуть меньше аватара (220px) */
      line-height: 1;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      animation: petBob 2.2s ease-in-out infinite;
      user-select: none;
      pointer-events: none;
    }
    .pet-display.pop { animation: petPop 0.45s ease, petBob 2.2s ease-in-out 0.45s infinite; }
    @keyframes petBob {
      0%, 100% { transform: translateY(-50%) rotate(-3deg); }
      50%      { transform: translateY(calc(-50% - 6px)) rotate(3deg); }
    }
    @keyframes petPop {
      0%   { transform: translateY(-50%) scale(0); }
      70%  { transform: translateY(-50%) scale(1.25); }
      100% { transform: translateY(-50%) scale(1); }
    }

    /* Выбор питомца под аватаром */
    .pet-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: -6px 0 24px;
      flex-wrap: wrap;
    }
    .pet-btn {
      font-size: 30px;
      line-height: 1;
      width: 52px;
      height: 52px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .pet-btn:hover { transform: scale(1.12); background: rgba(255,255,255,0.12); }
    .pet-btn.active {
      border-color: #4ecdc4;
      box-shadow: 0 0 14px rgba(78,205,196,0.6);
      background: rgba(78,205,196,0.18);
    }
    @media (max-width: 520px) {
      .profile-row { width: 180px; }
      .pet-display { font-size: 48px; right: -58px; }
      .pet-btn { width: 44px; height: 44px; font-size: 24px; }
    }

    .name {
      font-size: 48px;
      font-weight: bold;
      background: linear-gradient(135deg, #4ecdc4, #44a08d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Уровень и прогресс */
    .level-section {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(78, 205, 196, 0.3);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 40px;
    }

    .level-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .level-text {
      font-size: 24px;
      font-weight: bold;
      color: #4ecdc4;
    }

    .points-text {
      font-size: 18px;
      color: #888;
    }

    .progress-bar {
      width: 100%;
      height: 30px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid rgba(78, 205, 196, 0.3);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ecdc4, #44a08d);
      transition: width 0.5s ease;
      box-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
    }

    /* Витрина */
    /* Счётчик ачивок по редкости */
    .achievement-counter {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .counter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 14px;
      min-width: 70px;
    }

    .counter-item img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .counter-item .counter-count {
      font-size: 1.25em;
      font-weight: bold;
      color: #fff;
    }

    .counter-item .counter-label {
      font-size: 0.75em;
      opacity: 0.7;
    }

    .counter-item.zero {
      opacity: 0.35;
    }

    /* Фильтрация по клику на кристалл */
    .counter-item {
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      user-select: none;
    }

    .counter-item:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .counter-item.active {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
      opacity: 1;
    }

    .filter-hint {
      text-align: center;
      margin: -15px 0 25px;
      font-size: 0.85em;
      opacity: 0.6;
      min-height: 1.2em;
    }

    .showcase h2 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 30px;
    }

    .achievement {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
    }

    .achievement:hover {
      transform: translateY(-10px) scale(1.05);
    }

    .achievement-icon {
      width: 160px;
      height: 160px;
      margin: 0 auto 15px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      padding: 10px;
    }

    .achievement-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .achievement-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .achievement-desc {
      font-size: 14px;
      color: #888;
      margin-bottom: 10px;
    }

    .achievement-points {
      font-size: 14px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 10px;
      display: inline-block;
    }

    /* Типы ачивок */
    /* Обычная — белая — 1 балл */
    .achievement.common {
      border-color: rgba(255, 255, 255, 0.3);
    }
    .achievement.common:hover {
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 40px rgba(255, 255, 255, 0.2);
    }
    .achievement.common .achievement-points {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Необычная — синяя — 2 балла */
    .achievement.uncommon {
      border-color: rgba(59, 130, 246, 0.3);
      animation: glowUncommon 2s ease infinite;
    }
    @keyframes glowUncommon {
      0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
      50% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.6); }
    }
    .achievement.uncommon:hover {
      border-color: rgba(59, 130, 246, 0.6);
    }
    .achievement.uncommon .achievement-points {
      background: rgba(59, 130, 246, 0.3);
      color: #3b82f6;
    }

    /* Редкая — фиолетовая — 3 балла */
    .achievement.rare {
      border-color: rgba(168, 85, 247, 0.3);
      animation: glowRare 2s ease infinite;
    }
    @keyframes glowRare {
      0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
      50% { box-shadow: 0 0 40px rgba(168, 85, 247, 0.6); }
    }
    .achievement.rare:hover {
      border-color: rgba(168, 85, 247, 0.6);
    }
    .achievement.rare .achievement-points {
      background: rgba(168, 85, 247, 0.3);
      color: #a855f7;
    }

    /* Легендарная — золотая — 4 балла */
    .achievement.legendary {
      border-color: rgba(234, 179, 8, 0.3);
      animation: glowLegendary 2s ease infinite;
    }
    @keyframes glowLegendary {
      0%, 100% { box-shadow: 0 0 20px rgba(234, 179, 8, 0.3); }
      50% { box-shadow: 0 0 40px rgba(234, 179, 8, 0.6); }
    }
    .achievement.legendary:hover {
      border-color: rgba(234, 179, 8, 0.6);
    }
    .achievement.legendary .achievement-points {
      background: rgba(234, 179, 8, 0.3);
      color: #eab308;
    }

    /* Мифическая — красная — 5 баллов */
    .achievement.mythic {
      border-color: rgba(239, 68, 68, 0.3);
      animation: glowMythic 2s ease infinite;
    }
    @keyframes glowMythic {
      0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
      50% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.6); }
    }
    .achievement.mythic:hover {
      border-color: rgba(239, 68, 68, 0.6);
    }
    .achievement.mythic .achievement-points {
      background: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .hidden { display: none; }

    @media (max-width: 768px) {
      .back-button {
        padding: 10px 16px;
        font-size: 14px;
        top: 10px;
        left: 10px;
      }
      .profile { margin-top: 80px; }
      .name { font-size: 32px; }

      /* ===== Адаптация экрана выбора профиля под мобильные ===== */
      .name-box {
        padding: 22px 16px;
        width: min(94vw, 480px);
        border-radius: 16px;
      }
      .name-box h2 {
        font-size: 22px;
        margin-bottom: 18px;
      }
      .name-buttons {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .name-btn {
        aspect-ratio: 1 / 1;   /* на мобильных кнопки — одинаковые квадраты */
        font-size: 15px;
        border-radius: 12px;
        gap: 6px;
        padding: 8px;
      }
      .name-btn-avatar {
        width: 44px;
        height: 44px;
        border-width: 2px;
      }
      .name-btn-media { flex-direction: column; gap: 5px; }
      .piggy-bank { font-size: 12px; padding: 3px 8px; }
      .piggy-bank .piggy-crystal { width: 15px; height: 15px; }
      /* Отключаем scale-увеличение при нажатии, чтобы кнопки не «прыгали» */
      .name-btn:hover { transform: none; }
      .name-btn:active {
        background: color-mix(in srgb, var(--accent) 40%, transparent);
        border-color: var(--accent);
        box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
      }
    }

    /* Очень узкие экраны (смартфоны в портретной ориентации) */
    @media (max-width: 400px) {
      .name-box { padding: 18px 12px; }
      .name-box h2 { font-size: 19px; }
      .name-btn { font-size: 13px; }
      .name-btn-avatar { width: 38px; height: 38px; }
    }
  </style>
</head>
<body>
  <!-- Экран выбора имени -->
  <div class="name-screen" id="nameScreen">
    <div class="name-box">
      <h2>Выберите профиль</h2>
      <div class="name-buttons">
        <button class="name-btn" onmouseenter="setProfileAccent('Вадим')" onmouseleave="clearProfileAccent()" onclick="selectName('Вадим')"><div class="name-btn-media"><img class="name-btn-avatar" src="images/avatar_vadim.png" alt="Аватар Вадим"><span class="piggy-bank" title="Всего баллов за ачивки"><img class="piggy-crystal" src="images/crystal_common.png" alt="Кристалл баллов"><span class="coins" id="bank-Вадим">…</span></span></div>Вадим</button>
        <button class="name-btn" onmouseenter="setProfileAccent('Эрика')" onmouseleave="clearProfileAccent()" onclick="selectName('Эрика')"><div class="name-btn-media"><img class="name-btn-avatar" src="images/avatar_erika.png" alt="Аватар Эрика"><span class="piggy-bank" title="Всего баллов за ачивки"><img class="piggy-crystal" src="images/crystal_common.png" alt="Кристалл баллов"><span class="coins" id="bank-Эрика">…</span></span></div>Эрика</button>
        <button class="name-btn" onmouseenter="setProfileAccent('Катя')" onmouseleave="clearProfileAccent()" onclick="selectName('Катя')"><div class="name-btn-media"><img class="name-btn-avatar" src="images/avatar_katya.png" alt="Аватар Катя"><span class="piggy-bank" title="Всего баллов за ачивки"><img class="piggy-crystal" src="images/crystal_common.png" alt="Кристалл баллов"><span class="coins" id="bank-Катя">…</span></span></div>Катя</button>
        <button class="name-btn" onmouseenter="setProfileAccent('Леша')" onmouseleave="clearProfileAccent()" onclick="selectName('Леша')"><div class="name-btn-media"><img class="name-btn-avatar" src="images/avatar_lesha.png" alt="Аватар Леша"><span class="piggy-bank" title="Всего баллов за ачивки"><img class="piggy-crystal" src="images/crystal_common.png" alt="Кристалл баллов"><span class="coins" id="bank-Леша">…</span></span></div>Леша</button>
      </div>
    </div>
  </div>

  <!-- Экран пароля -->
  <div class="password-screen hidden" id="passwordScreen">
    <button class="back-button" onclick="backToNames()">Назад</button>
    <div class="password-box">
      <h2 id="passwordTitle">Введите пароль</h2>
      <input type="password" id="passwordInput" placeholder="Пароль">
      <button onclick="checkPassword()">Войти</button>
    </div>
  </div>

  <!-- Основной контент -->
  <div class="container hidden" id="mainContent">
    <!-- Кнопка назад -->
    <button class="back-button" onclick="goBack()">Назад</button>

    <div class="profile">
      <div class="profile-row">
        <div class="avatar" id="avatarWrap">
          <img src="images/avatar_default.png" alt="Аватар" id="avatarImg">
        </div>
        <span class="pet-display hidden" id="petDisplay"></span>
      </div>
      <div class="pet-picker" id="petPicker"></div>
      <h1 class="name" id="userName">Имя</h1>
    </div>

    <!-- Уровень и прогресс -->
    <div class="level-section">
      <div class="level-info">
        <div class="level-text" id="levelText">Уровень 1</div>
        <div class="points-text" id="pointsText">0 / 5 баллов</div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Счётчик ачивок по редкости -->
    <div class="achievement-counter" id="achievementCounter"></div>
    <div class="filter-hint" id="filterHint"></div>

    <div class="showcase">
      <h2>🏆 Витрина Ачивок</h2>
      <div class="grid" id="achievementsGrid" style="display: none;">
        <!-- Ачивки будут добавлены через JavaScript -->
      </div>
      <div class="grid" id="achievementsFiltered" style="display: none;"></div>
    </div>
  </div>

  <script>
    // Данные пользователей
    const users = {
      'Вадим': {
        password: '1995',
        avatar: 'images/avatar_vadim.png',
        achievements: [
          { title: 'Первый код', desc: 'Написал первую программу', type: 'common', points: 1, icon: 'images/icon_vadim_first_code.png' },
          { title: 'Мастер багов', desc: 'Исправил 100 багов', type: 'uncommon', points: 2, icon: 'images/icon_vadim_bug_master.png' },
          { title: 'Легенда кода', desc: '1000 коммитов', type: 'rare', points: 3, icon: 'images/icon_vadim_code_legend.png' },
          { title: 'Мифический хакер', desc: 'Взломал невозможное', type: 'legendary', points: 4, icon: 'images/icon_vadim_mythic_hacker.png' }
        ]
      },
      'Эрика': {
        password: '1',
        avatar: 'images/avatar_erika.png',
        achievements: [
          { title: 'Первый шаг', desc: 'Начала путь', type: 'common', points: 1, icon: 'images/icon_erika_first_step.png' },
          { title: 'Быстрая', desc: 'Пробежала 5 км', type: 'uncommon', points: 2, icon: 'images/icon_erika_fast.png' }
        ]
      },
      'Катя': {
        password: '2',
        avatar: 'images/avatar_katya.png',
        achievements: [
          { title: 'Новая', desc: 'Новая', type: 'common', points: 1, icon: 'images/katya-novaya.png' }
        ]
      },
      'Леша': {
        password: '3',
        avatar: 'images/avatar_lesha.png',
        achievements: [
          { title: 'Любить Вадика', desc: 'Всем сердцем', type: 'mythic', points: 5, icon: 'images/avatar_vadim.png' }
        ]
      }
    };

    let currentUser = null;

    /* ===== Питомцы профиля ===== */
    const PETS = [
      { id: 'cat',     emoji: '🐱', label: 'Кот' },
      { id: 'dog',     emoji: '🐶', label: 'Собака' },
      { id: 'panda',   emoji: '🐼', label: 'Панда' },
      { id: 'pig',     emoji: '🐷', label: 'Свинка' },
      { id: 'giraffe', emoji: '🦒', label: 'Жираф' },
      { id: 'peacock', emoji: '🦚', label: 'Павлин' }
    ];
    const PET_KEY = 'petSelections_v1'; // выбор питомца для каждого профиля

    function getPetSelections() {
      try { return JSON.parse(localStorage.getItem(PET_KEY)) || {}; }
      catch (e) { return {}; }
    }
    function savePetSelections(sel) {
      localStorage.setItem(PET_KEY, JSON.stringify(sel));
    }

    function renderPetPicker() {
      const picker = document.getElementById('petPicker');
      const sel = getPetSelections();
      const chosen = currentUser ? sel[currentUser] : null;
      picker.innerHTML = PETS.map(p =>
        `<button class="pet-btn${chosen === p.id ? ' active' : ''}" title="${p.label}" onclick="togglePet('${p.id}')">${p.emoji}</button>`
      ).join('');
      updatePetDisplay(false);
    }

    function togglePet(id) {
      const sel = getPetSelections();
      if (sel[currentUser] === id) delete sel[currentUser];  // повторный клик — убрать
      else sel[currentUser] = id;
      savePetSelections(sel);
      renderPetPicker();
      updatePetDisplay(true);
    }

    function updatePetDisplay(pop) {
      const el = document.getElementById('petDisplay');
      const chosen = getPetSelections()[currentUser];
      const pet = PETS.find(p => p.id === chosen);
      if (pet) {
        el.textContent = pet.emoji;
        el.classList.remove('hidden');
        if (pop) {
          el.classList.remove('pop');
          void el.offsetWidth; // перезапуск анимации
          el.classList.add('pop');
        }
      } else {
        el.textContent = '';
        el.classList.add('hidden');
      }
    }

    /* Копилки на экране выбора: суммарные баллы за ачивки каждого профиля */
    function renderPiggyBanks() {
      for (const name of Object.keys(users)) {
        const el = document.getElementById('bank-' + name);
        if (!el) continue;
        const total = users[name].achievements.reduce((sum, a) => sum + (a.points || 0), 0);
        el.textContent = total;
      }
    }
    renderPiggyBanks();

    function selectName(name) {
      currentUser = name;
      clearProfileAccent();
      document.getElementById('nameScreen').classList.add('hidden');
      document.getElementById('passwordScreen').classList.remove('hidden');
      document.getElementById('passwordTitle').textContent = `Пароль для ${name}`;
    }

    /* Смена акцентного цвета окна выбора профиля при наведении */
    function setProfileAccent(name) {
      document.getElementById('nameScreen').dataset.hover = name;
    }
    function clearProfileAccent() {
      delete document.getElementById('nameScreen').dataset.hover;
    }

    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      if (input === users[currentUser].password) {
        document.getElementById('passwordScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        loadProfile();
      } else {
        alert('Неверный пароль!');
      }
    }

    function backToNames() {
      // Возврат с экрана пароля на экран выбора имени
      currentUser = null;
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordScreen').classList.add('hidden');
      document.getElementById('nameScreen').classList.remove('hidden');
    }

    function goBack() {
      // Сбрасываем состояние
      currentUser = null;
      activeFilter = null;
      document.getElementById('passwordInput').value = '';
      
      // Скрываем профиль, показываем выбор имени
      document.getElementById('mainContent').classList.add('hidden');
      document.getElementById('nameScreen').classList.remove('hidden');
    }

    function loadProfile() {
      const user = users[currentUser];
      document.getElementById('userName').textContent = currentUser;
      document.getElementById('avatarImg').src = user.avatar;
      renderPetPicker();

      // Подсчёт баллов
      let totalPoints = 0;
      user.achievements.forEach(a => totalPoints += a.points);

      // Расчёт уровня: каждый уровень начинается с 0,
      // для 1-го нужно 5 баллов, для 2-го — 10 и т.д. (+5 за каждый уровень)
      let level = 0;
      let needed = 5;   // баллов до следующего уровня
      let remaining = totalPoints;
      while (remaining >= needed) {
        remaining -= needed;
        level++;
        needed += 5;
      }
      const progress = (remaining / needed) * 100;

      document.getElementById('levelText').textContent = `Уровень ${level}`;
      document.getElementById('pointsText').textContent = `${remaining} / ${needed} баллов`;

      document.getElementById('progressFill').style.width = `${progress}%`;

      // Счётчик ачивок по редкости (кристалл + количество, клик = фильтр)
      const rarityInfo = [
        { type: 'common',    label: 'Обычная',    icon: 'images/crystal_common.png' },
        { type: 'uncommon',  label: 'Необычная',  icon: 'images/crystal_uncommon.png' },
        { type: 'rare',      label: 'Редкая',     icon: 'images/crystal_rare.png' },
        { type: 'legendary', label: 'Легендарная',icon: 'images/crystal_legendary.png' },
        { type: 'mythic',    label: 'Мифическая', icon: 'images/crystal_mythic.png' }
      ];
      const counter = document.getElementById('achievementCounter');
      counter.innerHTML = '';
      rarityInfo.forEach(r => {
        const count = user.achievements.filter(a => a.type === r.type).length;
        const item = document.createElement('div');
        item.className = 'counter-item' + (count === 0 ? ' zero' : '');
        item.title = r.label + ' — нажмите для фильтрации';
        item.dataset.type = r.type;
        item.innerHTML = `
          <img src="${r.icon}" alt="${r.label}">
          <span class="counter-count">${count}</span>
        `;
        item.addEventListener('click', () => toggleFilter(r.type, r.label));
        counter.appendChild(item);
      });

      renderAchievements();
    }

    // Фильтрация витрины по клику на кристалл редкости
    let activeFilter = null;

    function toggleFilter(type, label) {
      activeFilter = (activeFilter === type) ? null : type;
      // Подсветка выбранного кристалла
      document.querySelectorAll('#achievementCounter .counter-item').forEach(el => {
        el.classList.toggle('active', el.dataset.type === activeFilter);
      });
      renderAchievements();
    }

    function renderAchievements() {
      const user = users[currentUser];
      if (!user) return;

      const gridAll = document.getElementById('achievementsGrid');
      const gridFiltered = document.getElementById('achievementsFiltered');
      const hint = document.getElementById('filterHint');

      const typeNames = {
        'common': 'Обычная',
        'uncommon': 'Необычная',
        'rare': 'Редкая',
        'legendary': 'Легендарная',
        'mythic': 'Мифическая'
      };

      const list = activeFilter
        ? user.achievements.filter(a => a.type === activeFilter)
        : user.achievements;

      const grid = activeFilter ? gridFiltered : gridAll;
      const other = activeFilter ? gridAll : gridFiltered;
      other.innerHTML = '';
      other.style.display = 'none';
      grid.innerHTML = '';

      if (activeFilter) {
        const label = typeNames[activeFilter];
        hint.textContent = `Фильтр: ${label}. Нажмите на 🔍 или тот же кристалл, чтобы сбросить`;
        const clearBtn = document.createElement('button');
        clearBtn.className = 'counter-item';
        clearBtn.style.margin = '0 auto 20px';
        clearBtn.style.display = 'flex';
        clearBtn.textContent = '🔍 Показать все';
        clearBtn.addEventListener('click', () => toggleFilter(activeFilter, label));
        hint.appendChild(document.createElement('br'));
        hint.appendChild(clearBtn);
      } else {
        hint.innerHTML = '';
      }

      list.forEach(a => {
        const div = document.createElement('div');
        div.className = `achievement ${a.type}`;
        div.innerHTML = `
          <div class="achievement-icon">
            <img src="${a.icon}" alt="${a.title}">
          </div>
          <div class="achievement-title">${a.title}</div>
          <div class="achievement-desc">${a.desc}</div>
          <div class="achievement-points">${typeNames[a.type]} · ${a.points} балл${a.points > 1 ? (a.points < 5 ? 'а' : 'ов') : ''}</div>
        `;
        grid.appendChild(div);
      });

      grid.style.display = list.length ? 'grid' : 'none';

      if (activeFilter && list.length === 0) {
        hint.textContent = 'Нет ачивок этой редкости';
      }
    }

    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
